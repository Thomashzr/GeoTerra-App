name: geoquiz_app
description: "Aplicación móvil de trivia geográfica (banderas, capitales y países)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Assets
  flutter_svg: ^2.0.17
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  google_fonts: ^6.2.1

  # Estado y Navegación
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.1.0
  go_router: ^14.8.1

  # Persistencia y Datos
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  hive_flutter: ^1.1.0

  # Audio & Feedback
  audioplayers: ^6.1.2

  # Monetización
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^4.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/flags/
    - assets/audio/
